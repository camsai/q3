name: SYCL/oneAPI Build and Test

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: "Enable SSH debug session (tmate)"
        required: false
        type: boolean
        default: false
      debug_timeout:
        description: "Debug session timeout (minutes)"
        required: false
        type: number
        default: 30

jobs:
  sycl-build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Pull LFS Files
        run: git lfs pull

      - name: Verify LFS Files
        run: |
          for f in examples/data/pseudopotentials/nc/Si.pz-vbc.UPF \
                   examples/data/pseudopotentials/us/Si_PBE_USPP.UPF; do
            if head -1 "$f" | grep -q "^version https://git-lfs"; then
              echo "ERROR: $f is still an LFS pointer, not actual data"
              exit 1
            fi
          done
          echo "All LFS files verified."

      - name: Install oneAPI Repository
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget -q -O - https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/intel.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | \
            sudo tee /etc/apt/sources.list.d/intel-oneapi.list
          sudo apt-get update

      - name: Install oneAPI Packages
        run: |
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp \
            intel-oneapi-mkl-devel

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y cmake build-essential libfftw3-dev libomp-dev liblapack-dev libblas-dev libxc-dev ccache

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,build]"

      - name: Locate the ccache directory
        id: ccache
        run: |
          # Resolve ccache's real store rather than hardcoding it, and bound
          # its size -- see ci.yml's build-and-test job for why.
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "dir=$(ccache --get-config cache_dir)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ steps.ccache.outputs.dir }}
          # actions/cache writes only when the key is new, so a key that moves
          # only with CMakeLists.txt saves once and then never takes in
          # newly compiled objects. Make it run-unique and fall back by
          # prefix, the way the build-directory cache already does.
          key: ccache-sycl-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-sycl-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-
            ccache-sycl-${{ runner.os }}-

      - name: Configure CMake (SYCL)
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build_sycl \
            -DCMAKE_BUILD_TYPE=Release \
            -DQ3_WITH_SYCL=ON \
            -DQ3_BUILD_TESTS=OFF \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (SYCL)
        run: |
          source /opt/intel/oneapi/setvars.sh
          ccache -z
          cmake --build build_sycl -j$(nproc) --target q3_gpu_sycl
          ccache -s

      - name: Validate SYCL Backend (Si FCC 2×2×2)
        run: |
          source /opt/intel/oneapi/setvars.sh
          echo "=== SYCL FP64 (CPU fallback via oneMKL) ==="
          ./build_sycl/q3_gpu_sycl examples/total_energy--semiconductor--silicon/nc.yml

      - name: SSH Debug Session
        if: always() && inputs.enable_debug
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: ${{ fromJSON(inputs.debug_timeout) }}
        with:
          limit-access-to-actor: true
