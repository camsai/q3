name: Deploy Documentation

on:
  # Every push to main republishes the site. Only the public repository has a
  # Pages site, so elsewhere the docs are built (which checks they still build)
  # but not deployed.
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Fetch Doxygen Awesome CSS Theme
        run: |
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git \
            docs/doxygen-awesome-css

      - name: Generate Documentation
        run: |
          mkdir -p docs_build
          doxygen Doxyfile
          # Pages can show images from docs/figures/.
          mkdir -p docs_build/html/docs
          cp -R docs/figures docs_build/html/docs/
          # Dark theme (doxygen-awesome-css styles html.dark-mode), the favicon
          # (docs/favicon.*, the README logo, copied by Doxygen), the logo and project
          # name in the sidebar header as a link to the landing page (docs/doxygen-q3.css
          # hides the sidebar's own entry for it), and a script that opens the sidebar's
          # second level and highlights the current page (docs/navtree-expand.js, copied
          # by Doxygen). Doxygen has no option for the favicon or the header link.
          find docs_build/html -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#<html #<html class="dark-mode" #' \
            -e 's#</head>#<link rel="icon" href="favicon.ico" sizes="any"/><link rel="icon" type="image/png" href="favicon.png"/><link rel="apple-touch-icon" href="favicon.png"/></head>#' \
            -e 's#\(<td id="projectlogo">\)\(<img [^>]*>\)#\1<a href="index.html">\2</a>#' \
            -e 's#\(<div id="projectname">\)\([^<]*\)$#\1<a href="index.html">\2</a>#' \
            -e 's#</body>#<script src="navtree-expand.js"></script></body>#'

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_build/html

  deploy:
    # Spelled with the clean org so the export's org rewrite leaves it alone.
    if: github.ref == 'refs/heads/main' && github.repository == 'camsai/q3'
    needs: build-docs
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
