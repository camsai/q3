name: Deploy Documentation

on:
  # Runs by hand: GitHub Pages can be enabled only once camsai/q3 is public.
  # After that, re-enable the push trigger below.
  # push:
  #   branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Fetch Doxygen Awesome CSS Theme
        run: |
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git \
            docs/doxygen-awesome-css

      - name: Generate Documentation
        run: |
          mkdir -p docs_build
          doxygen Doxyfile

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
