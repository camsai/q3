name: HIP/ROCm Compile-Only Build

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: "Enable SSH debug session (tmate)"
        required: false
        type: boolean
        default: false
      debug_timeout:
        description: "Debug session timeout (minutes)"
        required: false
        type: number
        default: 30

jobs:
  hip-compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Pull LFS Files
        run: git lfs pull

      - name: Install ROCm Repository
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4 jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          echo 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600' | \
            sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update

      - name: Install ROCm Dev Packages
        run: |
          sudo apt-get install -y \
            hip-dev \
            hipblas-dev \
            hipsolver-dev \
            hipfft-dev \
            rocm-cmake

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y cmake build-essential libfftw3-dev libomp-dev liblapack-dev libblas-dev libxc-dev ccache

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,build]"

      - name: Locate the ccache directory
        id: ccache
        run: |
          # Resolve ccache's real store rather than hardcoding it, and bound
          # its size -- see ci.yml's build-and-test job for why.
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "dir=$(ccache --get-config cache_dir)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ steps.ccache.outputs.dir }}
          # actions/cache writes only when the key is new, so a key that moves
          # only with CMakeLists.txt saves once and then never takes in
          # newly compiled objects. Make it run-unique and fall back by
          # prefix, the way the build-directory cache already does.
          key: ccache-hip-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-hip-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-
            ccache-hip-${{ runner.os }}-

      - name: Configure CMake (HIP)
        run: |
          export PATH=/opt/rocm/bin:$PATH
          export CMAKE_PREFIX_PATH=/opt/rocm:$CMAKE_PREFIX_PATH
          cmake -S . -B build_hip \
            -DCMAKE_BUILD_TYPE=Release \
            -DQ3_WITH_HIP=ON \
            -DQ3_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (HIP) — Compile Only
        run: |
          ccache -z
          cmake --build build_hip -j$(nproc) --target q3_gpu_hip
          ccache -s
          echo "HIP backend compiled successfully (no GPU hardware to run)"

      - name: SSH Debug Session
        if: always() && inputs.enable_debug
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: ${{ fromJSON(inputs.debug_timeout) }}
        with:
          limit-access-to-actor: true
