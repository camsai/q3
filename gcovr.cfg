# gcovr configuration
# Only report on src/ files that are unit-testable.
# Files exercised only via full SCF runs (q3 binary) are excluded.

filter = src/

# Entry point — not unit-testable
exclude = src/main\.cpp

# Forces & stress tensor computation — requires converged SCF state
exclude = src/layer_5_properties/forces/
exclude = src/layer_5_properties/stress_tensor/planewave/

# IO subsystems exercised only by full binary runs
exclude = src/io/charge_density/
exclude = src/io/checkpoint/
exclude = src/io/output/
exclude = src/io/quantum_system/
exclude = src/io/wavefunction/
exclude = src/io/pseudopotential/loader\.hpp
exclude = src/io/pseudopotential/upf_reader/v2/

# SCF state/iterator wiring — thin factories called only during full SCF
exclude = src/layer_4_computation/state/
exclude = src/layer_4_computation/iterator/factory\.hpp
exclude = src/layer_4_computation/iterator/kohn_sham/internal/checkpoint_manager\.hpp

# CI coverage threshold — fail if line coverage drops below 80%
fail_under_line = 80
