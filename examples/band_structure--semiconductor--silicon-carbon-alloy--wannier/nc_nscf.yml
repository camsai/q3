material: ../data/materials/silicon_carbon_alloy.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 100.0
    density: 400.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
    C: ../data/pseudopotentials/nc/C.upf
  scf:
    convergence_threshold: 1.0e-10
    number_of_bands: 20
    mixing:
      mode: broyden
      beta: 0.3
      ndim: 8
