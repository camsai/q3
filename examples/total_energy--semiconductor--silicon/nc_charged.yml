material: ../data/materials/silicon.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 48.0
    density: 192.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
  scf:
    convergence_threshold: 1.0e-08
    number_of_bands: 8
    total_charge: 1.0
    smearing:
      type: gaussian
      degauss: 0.01
    mixing:
      mode: broyden
      beta: 0.3
      ndim: 8
    kgrid:
      dimensions:
        - 2
        - 2
        - 2
      shifts:
        - 1
        - 1
        - 1
control:
  calculation: scf
  outdir: ./output
  prefix: si_nc_charged
