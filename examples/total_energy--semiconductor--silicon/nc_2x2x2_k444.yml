# 16-atom silicon supercell with a 4x4x4 shifted k-mesh.
#
# nc_2x2x2.yml with only the k-grid changed. It exists because every other
# large-cell deck here samples a single k-point, which leaves the regime that
# matters for parallel runs -- a cell big enough for the FFTs to dominate, with
# enough irreducible k-points to fill several pools -- unrepresented.
#
# QE counterpart: reference/nc/scf_qe_2x2x2_k444.in
material: ../data/materials/silicon_2x2x2.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 48.0
    density: 192.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
  scf:
    convergence_threshold: 1.0e-08
    number_of_bands: 40
    mixing:
      mode: broyden
      beta: 0.3
      ndim: 8
    kgrid:
      dimensions:
        - 4
        - 4
        - 4
      shifts:
        - 1
        - 1
        - 1
control:
  calculation: scf
  outdir: ./output
  prefix: si_nc_2x2x2_k444
