material: ../data/materials/silicon_3x3x3.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 48.0
    density: 192.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
  scf:
    convergence_threshold: 1.0e-08
    number_of_bands: 130
    mixing:
      mode: broyden
      beta: 0.3
      ndim: 8
      preconditioning: kerker
    kgrid:
      dimensions:
        - 1
        - 1
        - 1
      shifts:
        - 1
        - 1
        - 1
control:
  calculation: scf
  outdir: ./output
  prefix: si_nc_3x3x3_shifted
