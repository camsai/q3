material: ../data/materials/silicon_3x3x3_displaced.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 48.0
    density: 192.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
  scf:
    convergence_threshold: 1.0e-6
    number_of_bands: 130
    mixing:
      mode: broyden
      beta: 0.3
      ndim: 8
      preconditioning: kerker
    kgrid:
      dimensions:
        - 1
        - 1
        - 1
      shifts:
        - 0
        - 0
        - 0
control:
  calculation: relaxation
  outdir: ./output
  prefix: si_nc_3x3x3_relax
  relax_max_steps: 50
  relax_force_threshold: 5.0e-3
  relax_energy_threshold: 1.0e-5
