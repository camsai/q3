material: ../data/materials/silicon.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: norm-conserving
  cutoffs:
    wavefunction: 48.0
    density: 192.0
  pseudopotentials:
    Si: ../data/pseudopotentials/nc/Si.upf
  scf:
    convergence_threshold: 1.0e-08
    number_of_bands: 12
    mixing:
      mode: broyden
      beta: 0.7
      ndim: 8
    kgrid:
      dimensions:
        - 4
        - 4
        - 4
      shifts:
        - 0
        - 0
        - 0
control:
  calculation: density_of_states
  outdir: ./output
  prefix: si_dos_nc
  dos_broadening: 0.01
  dos_energy_steps: 3000
