material: ../data/materials/copper.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: ultrasoft
  cutoffs:
    wavefunction: 40.0
    density: 200.0
  pseudopotentials:
    Cu: ../data/pseudopotentials/us/cu_pbe_v1.2.uspp.F.UPF
  scf:
    convergence_threshold: 1.0e-08
    max_iterations: 200
    mixing:
      mode: broyden
      beta: 0.2
      preconditioning: none
    smearing:
      type: gaussian
      degauss: 0.02
    kgrid:
      dimensions:
        - 4
        - 4
        - 4
      shifts:
        - 1
        - 1
        - 1
control:
  calculation: scf
  outdir: ./output
  prefix: cu_us
