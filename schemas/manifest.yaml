# Schema Manifest — controls which JSON schemas get C++ code generated.
#
# Each entry maps a JSON schema file to a C++ struct name and output path.
# The generator reads this file and produces headers under src/generated/.

# ESSE schemas, resolved ($refs inlined, allOf merged), written from the pinned
# mat3ra-esse package to the untracked schemas/esse by scripts/repo/schemas.py.
esse:
  base_path: schemas/esse

  # A Q3 schema that refers to one of these by $ref gets its struct here, not a
  # copy under a Q3 name (generate_cpp_from_schemas.py, _esse_structs).
  schemas:
    - schema: core/reusable/energy.json
      cpp_name: Energy
      output: esse/core/reusable/energy.hpp
    - schema: properties_directory/scalar/total_energy.json
      cpp_name: TotalEnergy
      output: esse/properties/scalar/total_energy.hpp
    - schema: properties_directory/scalar/fermi_energy.json
      cpp_name: FermiEnergy
      output: esse/properties/scalar/fermi_energy.hpp
    - schema: properties_directory/non_scalar/density_of_states.json
      cpp_name: DensityOfStates
      output: esse/properties/non_scalar/density_of_states.hpp
    - schema: properties_directory/scalar/pressure.json
      cpp_name: Pressure
      output: esse/properties/scalar/pressure.hpp
    - schema: properties_directory/non_scalar/total_energy_contributions.json
      cpp_name: TotalEnergyContributions
      output: esse/properties/non_scalar/total_energy_contributions.hpp
    - schema: properties_directory/non_scalar/stress_tensor.json
      cpp_name: StressTensor
      output: esse/properties/non_scalar/stress_tensor.hpp
    - schema: properties_directory/non_scalar/band_gaps.json
      cpp_name: BandGaps
      output: esse/properties/non_scalar/band_gaps.hpp
    - schema: properties_directory/structural/atomic_forces.json
      cpp_name: AtomicForces
      output: esse/properties/structural/atomic_forces.hpp
    - schema: properties_directory/workflow/convergence/electronic.json
      cpp_name: ConvergenceElectronic
      output: esse/properties/workflow/convergence_electronic.hpp
    - schema: properties_directory/non_scalar/eigenvalues_at_kpoints.json
      cpp_name: EigenvaluesAtKpoints
      output: esse/properties/non_scalar/eigenvalues_at_kpoints.hpp
    - schema: properties_directory/scalar/band_edge_valence_max.json
      cpp_name: BandEdgeValenceMax
      output: esse/properties/scalar/band_edge_valence_max.hpp
    - schema: properties_directory/scalar/band_edge_conduction_min.json
      cpp_name: BandEdgeConductionMin
      output: esse/properties/scalar/band_edge_conduction_min.hpp
    - schema: properties_directory/scalar/magnetization_total.json
      cpp_name: MagnetizationTotal
      output: esse/properties/scalar/magnetization_total.hpp
    - schema: properties_directory/scalar/magnetization_absolute.json
      cpp_name: MagnetizationAbsolute
      output: esse/properties/scalar/magnetization_absolute.hpp

# Q3-specific schemas — resolve $refs, then generate
q3:
  base_path: schemas/q3
  resolve_refs: true

  schemas:
    - schema: input.json
      cpp_name: Input
      output: q3/input.hpp
      # Also emit the schema's own per-object key allow-lists, which
      # src/io/input/parser/yaml.hpp validates manifests against instead of
      # keeping its own hand-written copies of them.
      key_registry: true
    # results.json: the struct every flavor fills and returns, and serializes.
    # Its "properties" records are the ESSE structs above, carried as json
    # (the schema lists them as a oneOf, which has no single C++ type).
    - schema: results.json
      cpp_name: Results
      output: q3/results.hpp
      # Built as JSON where they are made (build_material_json(),
      # build_provenance_json()); the schema validates them.
      opaque: [structure.material, provenance, runtime_log.timings_ms]
      # The Python models, generated by scripts/repo/generate_python_from_schemas.py;
      # `bases` gives a block, by its schema $id, the hand-written base that
      # carries what a reader needs beyond the data.
      python:
        module: q3.generated.results
        bases:
          q3/results: q3.io.results.base.ResultsDocument
          q3/results/properties: q3.io.results.base.RecordsBlock
    - schema: interpolation/results.json
      cpp_name: InterpolationResults
      output: q3/interpolation/results.hpp
      python:
        module: q3.generated.interpolation.results
        bases:
          q3/interpolation/results: q3.io.interpolation.results.base.InterpolationResultsDocument
